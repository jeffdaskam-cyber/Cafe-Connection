<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Connection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; }
      body { background: #F1F0EE; }
      #root { zoom: 1.35; }

      /* ── Accounting Report print styles ── */
      #accounting-report-print-container {
        display: none;
        position: absolute;
        left: -9999px;
        visibility: hidden;
      }
      @media print {
        #root { display: none !important; }
        #accounting-report-print-container {
          display: block !important;
          position: static !important;
          left: auto !important;
          visibility: visible !important;
          padding: 32px;
          font-family: Arial, sans-serif;
          font-size: 12pt;
        }
        .accounting-report-table table {
          width: 100%;
          border-collapse: collapse;
        }
        .accounting-report-table td {
          padding: 8px 12px;
          border-bottom: 1px solid #ddd;
        }
      }
    </style>
    <!-- PDF.js for canvas-based PDF rendering (Weekly Packet print) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
