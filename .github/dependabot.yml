version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Collapse routine updates into a single PR per ecosystem so the repo gets
    # one Vercel preview build and one production deploy per batch, instead of
    # one per dependency. Majors stay ungrouped: they get their own PR so a
    # breaking change can be reviewed and reverted on its own.
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint-plugin-react's latest release (7.37.5, April 2025) peer-requires
      # eslint "^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9.7" and has no published
      # version that accepts ESLint 10, so any major eslint bump makes the
      # dependency graph unresolvable and fails `npm install` with ERESOLVE.
      # eslint-plugin-react-hooks and eslint-plugin-react-refresh already
      # support ESLint 10; eslint-plugin-react is the only holdout.
      #
      # Remove this entry once eslint-plugin-react ships ESLint 10 support.
      # The upgrade also needs @eslint/js moved to ^10 in the same change,
      # since @eslint/js@10 peer-requires eslint ^10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

      # firebase-admin 14 depends on jwks-rsa ^4, which requires jose ^6. jose 6
      # is ESM-only, and jwks-rsa's src/utils.js is CommonJS doing
      # `require('jose')`. Node 22 papers over that locally with require(esm),
      # but the Vercel function runtime does not implement it, so every endpoint
      # that touches firebase-admin dies at module load with ERR_REQUIRE_ESM and
      # returns 500. Batching the v14 bump did exactly this in #231.
      #
      # v13 stays on jwks-rsa 3.x -> jose ^4 (CommonJS) and loads correctly.
      # test/api-handlers-load.test.mjs reproduces the break, but nothing runs
      # the suite on a PR yet, so this entry is what stops the bump returning.
      #
      # Remove this entry once jwks-rsa ships a build whose CommonJS entry does
      # not require() an ESM-only jose (or the runtime supports require(esm)).
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]
